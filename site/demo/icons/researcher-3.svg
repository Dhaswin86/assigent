<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256" shape-rendering="crispEdges" role="img" aria-label="Plan writer listing the build steps">
<title>Plan writer listing the build steps</title>
<style>
.rp-eyes { animation: rp-blink 4s steps(1) infinite; animation-delay: var(--d, 0s); transform-box: fill-box; transform-origin: center; }
@keyframes rp-blink { 0%, 92%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.2); } }

.rp-seq { opacity: 0; animation: rp-seq 5s steps(1) infinite both; animation-delay: var(--d, 0s); }
@keyframes rp-seq { 0% { opacity: 0; } 3%, 88% { opacity: 1; } 89%, 100% { opacity: 0; } }
.rp-pen { animation: rp-pen .5s steps(2) infinite; animation-delay: var(--d, 0s); }
@keyframes rp-pen { 50% { transform: translate(1px, -1px); } }
.rp-bob { animation: rp-bob .9s steps(2) infinite; animation-delay: var(--d, 0s); }
@keyframes rp-bob { 50% { transform: translateY(-.5px); } }
</style>
<rect x="15" y="3" width="14" height="20" fill="#f4efe4"/><rect x="15" y="22" width="14" height="1" fill="#d8d0c0"/><rect x="17" y="5" width="8" height="1" fill="#8d939a"/><g class="rp-seq" style="animation-delay:calc(var(--d, 0s) + 0.0s)"><rect x="16" y="7" width="2" height="2" fill="#c9697a"/><rect x="19" y="7" width="5" height="1" fill="#c9bfae"/><rect x="19" y="9" width="3" height="1" fill="#c9bfae"/><rect x="25" y="7" width="3" height="3" fill="#8fb3ff"/><rect x="26" y="8" width="1" height="1" fill="#ffffff"/></g><g class="rp-seq" style="animation-delay:calc(var(--d, 0s) + 1.0s)"><rect x="16" y="11" width="2" height="2" fill="#c9697a"/><rect x="19" y="11" width="5" height="1" fill="#c9bfae"/><rect x="19" y="13" width="4" height="1" fill="#c9bfae"/></g><g class="rp-seq" style="animation-delay:calc(var(--d, 0s) + 2.0s)"><rect x="16" y="15" width="2" height="2" fill="#c9697a"/><rect x="19" y="15" width="5" height="1" fill="#c9bfae"/><rect x="19" y="17" width="3" height="1" fill="#c9bfae"/><rect x="25" y="15" width="3" height="3" fill="#8fb3ff"/><rect x="26" y="16" width="1" height="1" fill="#ffffff"/></g><g class="rp-seq" style="animation-delay:calc(var(--d, 0s) + 3.0s)"><rect x="16" y="19" width="2" height="2" fill="#c9697a"/><rect x="19" y="19" width="5" height="1" fill="#c9bfae"/><rect x="19" y="21" width="4" height="1" fill="#c9bfae"/></g><g class="rp-bob"><rect x="2" y="17" width="8" height="6" fill="#d97757"/><rect x="0" y="19" width="2" height="2" fill="#d97757"/><rect x="10" y="19" width="2" height="2" fill="#d97757"/><rect x="2" y="23" width="1" height="2" fill="#d97757"/><rect x="4" y="23" width="1" height="2" fill="#d97757"/><rect x="7" y="23" width="1" height="2" fill="#d97757"/><rect x="9" y="23" width="1" height="2" fill="#d97757"/><g class="rp-eyes"><rect x="7" y="18" width="1" height="1" fill="#1d1b18"/><rect x="9" y="18" width="1" height="1" fill="#1d1b18"/></g><g class="rp-pen"><rect x="12" y="15" width="1" height="4" fill="#2a2f38"/><rect x="12" y="14" width="1" height="1" fill="#c9697a"/></g></g>
</svg>
