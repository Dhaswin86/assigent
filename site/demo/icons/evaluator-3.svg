<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256" shape-rendering="crispEdges" role="img" aria-label="Scorer filling the scoreboard and stamping the sheet">
<title>Scorer filling the scoreboard and stamping the sheet</title>
<style>
.sc-eyes { animation: sc-blink 4s steps(1) infinite; animation-delay: var(--d, 0s); transform-box: fill-box; transform-origin: center; }
@keyframes sc-blink { 0%, 92%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.2); } }

.sc-seq { opacity: 0; animation: sc-seq 4.6s steps(1) infinite both; animation-delay: var(--d, 0s); }
@keyframes sc-seq { 0% { opacity: 0; } 3%, 88% { opacity: 1; } 89%, 100% { opacity: 0; } }
.sc-stamp { animation: sc-stamp 1.15s ease-in infinite; animation-delay: var(--d, 0s); }
@keyframes sc-stamp { 0%, 40% { transform: translateY(0); } 62%, 72% { transform: translateY(5px); } 100% { transform: translateY(0); } }
.sc-seal { opacity: 0; animation: sc-seal 4.6s steps(1) infinite; animation-delay: var(--d, 0s); }
@keyframes sc-seal { 0%, 60% { opacity: 0; } 61%, 94% { opacity: 1; } 95%, 100% { opacity: 0; } }
.sc-bob { animation: sc-bob .8s steps(2) infinite; animation-delay: var(--d, 0s); }
@keyframes sc-bob { 50% { transform: translateY(-.5px); } }
</style>
<rect x="14" y="3" width="16" height="12" fill="#3a3f48"/><rect x="15" y="4" width="14" height="10" fill="#1e2a38"/><rect x="21" y="15" width="2" height="3" fill="#3a3f48"/><g class="sc-seq" style="animation-delay:calc(var(--d, 0s) + 0.0s)"><rect x="16.0" y="9" width="2" height="4" fill="#8fb3ff"/></g><g class="sc-seq" style="animation-delay:calc(var(--d, 0s) + 0.6s)"><rect x="18.6" y="7" width="2" height="6" fill="#c59cf0"/></g><g class="sc-seq" style="animation-delay:calc(var(--d, 0s) + 1.2s)"><rect x="21.2" y="8" width="2" height="5" fill="#8fb3ff"/></g><g class="sc-seq" style="animation-delay:calc(var(--d, 0s) + 1.8s)"><rect x="23.8" y="5" width="2" height="8" fill="#6fbf5f"/></g><g class="sc-seq" style="animation-delay:calc(var(--d, 0s) + 2.4s)"><rect x="26.4" y="6" width="2" height="7" fill="#e9b949"/></g><rect x="12" y="21" width="18" height="2" fill="#a06b47"/><rect x="13" y="23" width="16" height="6" fill="#8a5a3b"/><rect x="13" y="28" width="16" height="1" fill="#6e4a31"/><rect x="18" y="19" width="9" height="2" fill="#f4efe4"/><g class="sc-seal"><rect x="21" y="19" width="3" height="2" fill="#6fbf5f"/></g><g class="sc-stamp"><rect x="21" y="12" width="3" height="2" fill="#845a9c"/><rect x="22" y="9" width="1" height="3" fill="#6e4a31"/></g><g class="sc-bob"><rect x="2" y="13" width="8" height="6" fill="#d97757"/><rect x="0" y="15" width="2" height="2" fill="#d97757"/><rect x="10" y="15" width="2" height="2" fill="#d97757"/><rect x="2" y="19" width="1" height="2" fill="#d97757"/><rect x="4" y="19" width="1" height="2" fill="#d97757"/><rect x="7" y="19" width="1" height="2" fill="#d97757"/><rect x="9" y="19" width="1" height="2" fill="#d97757"/><g class="sc-eyes"><rect x="7" y="14" width="1" height="1" fill="#1d1b18"/><rect x="9" y="14" width="1" height="1" fill="#1d1b18"/></g></g>
</svg>
