t="2" fill="#d97757"/><rect x="9" y="23" width="1" height="2" fill="#d97757"/><g class="ev-eyes"><rect x="7" y="18" width="1" height="1" fill="#1d1b18"/><rect x="9" y="18" width="1" height="1" fill="#1d1b18"/></g><g class="ev-pen"><rect x="12" y="15" width="1" height="4" fill="#2a2f38"/><rect x="12" y="14" width="1" height="1" fill="#c59cf0"/></g></g>
