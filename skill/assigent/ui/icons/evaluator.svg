<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256" shape-rendering="crispEdges" role="img" aria-label="Evaluator ticking the rubric">
<title>Evaluator ticking the rubric</title>
<style>
.ev-eyes { animation: ev-blink 4s steps(1) infinite; animation-delay: var(--d, 0s); transform-box: fill-box; transform-origin: center; }
@keyframes ev-blink { 0%, 92%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.2); } }

.ev-seq { opacity: 0; animation: ev-seq 5s steps(1) infinite both; animation-delay: var(--d, 0s); }
@keyframes ev-seq { 0% { opacity: 0; } 3%, 88% { opacity: 1; } 89%, 100% { opacity: 0; } }
.ev-pen { animation: ev-pen .5s steps(2) infinite; animation-delay: var(--d, 0s); }
@keyframes ev-pen { 50% { transform: translate(1px, -1px); } }
.ev-bob { animation: ev-bob .9s steps(2) infinite; animation-delay: var(--d, 0s); }
@keyframes ev-bob { 50% { transform: translateY(-.5px); } }
</style>
