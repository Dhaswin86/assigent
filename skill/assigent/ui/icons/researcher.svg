<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256" shape-rendering="crispEdges" role="img" aria-label="Researcher reading a source closely">
<title>Researcher reading a source closely</title>
<style>
.rs-eyes { animation: rs-blink 4s steps(1) infinite; animation-delay: var(--d, 0s); transform-box: fill-box; transform-origin: center; }
@keyframes rs-blink { 0%, 92%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.2); } }

.rs-seq { opacity: 0; animation: rs-seq 5s steps(1) infinite both; animation-delay: var(--d, 0s); }
@keyframes rs-seq { 0% { opacity: 0; } 3%, 88% { opacity: 1; } 89%, 100% { opacity: 0; } }
.rs-pen { animation: rs-pen 5s steps(1) infinite; animation-delay: var(--d, 0s); }
@keyframes rs-pen { 0% { transform: translate(3px, -11px); } 20% { transform: translate(4px, -7px); } 40% { transform: translate(12px, -9px); }
  60% { transform: translate(13px, -5px); } 88%, 100% { transform: translate(0, 0); } }
</style>
<rect x="12" y="19" width="18" height="2" fill="#a8515f"/><rect x="13" y="6" width="8" height="14" fill="#f4efe4"/><rect x="21" y="6" width="8" height="14" fill="#ffffff"/><rect x="21" y="6" width="1" height="14" fill="#c9bfae"/><rect x="14" y="8" width="6" height="1" fill="#c9bfae"/><rect x="14" y="10" width="5" height="1" fill="#c9bfae"/><rect x="14" y="12" width="6" height="1" fill="#c9bfae"/><rect x="14" y="14" width="4" height="1" fill="#c9bfae"/><rect x="14" y="16" width="6" height="1" fill="#c9bfae"/><rect x="23" y="8" width="5" height="1" fill="#c9bfae"/><rect x="23" y="10" width="5" height="1" fill="#c9bfae"/><rect x="23" y="12" width="4" height="1" fill="#c9bfae"/><rect x="23" y="14" width="5" height="1" fill="#c9bfae"/><rect x="23" y="16" width="3" height="1" fill="#c9bfae"/><g class="rs-seq" style="animation-delay:calc(var(--d, 0s) + 0.0s)"><rect x="14" y="8" width="6" height="1" fill="#f2c230"/></g><g class="rs-seq" style="animation-delay:calc(var(--d, 0s) + 1.0s)"><rect x="14" y="12" width="6" height="1" fill="#f2c230"/></g><g class="rs-seq" style="animation-delay:calc(var(--d, 0s) + 2.0s)"><rect x="23" y="10" width="5" height="1" fill="#f2c230"/></g><g class="rs-seq" style="animation-delay:calc(var(--d, 0s) + 3.0s)"><rect x="23" y="14" width="5" height="1" fill="#f2c230"/></g><rect x="2" y="15" width="8" height="6" fill="#d97757"/><rect x="0" y="17" width="2" height="2" fill="#d97757"/><rect x="10" y="17" width="2" height="2" fill="#d97757"/><g class="rs-eyes"><rect x="7" y="16" width="1" height="1" fill="#1d1b18"/><rect x="9" y="16" width="1" height="1" fill="#1d1b18"/></g><rect x="1" y="21" width="30" height="2" fill="#a06b47"/><rect x="2" y="23" width="28" height="7" fill="#8a5a3b"/><rect x="13" y="25" width="6" height="1" fill="#6e4a31"/><rect x="2" y="29" width="28" height="1" fill="#6e4a31"/><g class="rs-pen"><rect x="12" y="15" width="1" height="3" fill="#f2c230"/><rect x="12" y="18" width="1" height="1" fill="#2a2f38"/></g>
</svg>
