<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="256" height="256" shape-rendering="crispEdges" role="img" aria-label="Cross-checker linking sources that agree">
<title>Cross-checker linking sources that agree</title>
<style>
.rx-eyes { animation: rx-blink 4s steps(1) infinite; animation-delay: var(--d, 0s); transform-box: fill-box; transform-origin: center; }
@keyframes rx-blink { 0%, 92%, 100% { transform: scaleY(1); } 94% { transform: scaleY(.2); } }

.rx-seq { opacity: 0; animation: rx-seq 4.4s steps(1) infinite both; animation-delay: var(--d, 0s); }
@keyframes rx-seq { 0% { opacity: 0; } 3%, 88% { opacity: 1; } 89%, 100% { opacity: 0; } }
.rx-arm { animation: rx-arm 1.1s steps(2) infinite; animation-delay: var(--d, 0s); }
@keyframes rx-arm { 50% { transform: translate(2px, -2px); } }
</style>
